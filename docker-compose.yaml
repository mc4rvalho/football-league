version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: senai_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senhaforte123
      POSTGRES_DB: senai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: