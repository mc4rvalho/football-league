services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senai_local_password
      POSTGRES_DB: senai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d senai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
